name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nastolka-bot
          region: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}
          source: .
          flags: --allow-unauthenticated --min-instances=0 --max-instances=1 --memory=256Mi --cpu=1
          env_vars: |
            APP_ENV=prod
            NASTOLKA_API_BASE_URL=${{ vars.NASTOLKA_API_BASE_URL }}
            WEBHOOK_URL=${{ vars.CLOUD_RUN_URL }}
            WEBAPP_BASE_URL=${{ vars.WEBAPP_BASE_URL }}
          secrets: |
            TELEGRAM_BOT_TOKEN=telegram-bot-token:latest
            TELEGRAM_BOT_SECRET=telegram-bot-secret:latest
            TELEGRAM_WEBHOOK_SECRET=telegram-webhook-secret:latest
